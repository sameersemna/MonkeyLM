name: MonkeyLM Regression Tests

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run regression unittest suite
        env:
          TARGET_URL: https://example.org/
        run: |
          python -m unittest tests/test_monkey_agent_advanced.py
